name: "🐛 Report an XNFS bug"
description: "Help investigate installation, playback or runtime problems"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing **XNFS Playlist Builder 3.2 Beta 1.7**.

        Most Wanted developer reports include **45-track gameplay passes** for custom Pursuit, Safe House and Free Roam. The result may vary with executable, loader or mods.

        **Audio balance note, already developer-verified:** To change engine sound in Most Wanted, adjust **Audio options → Car Volume in the game**. The builder's music volume does not control the engine.

        Use **Support → preview Plain English or JSON → Save ZIP** to create a local `diagnostics.txt` / `diagnostics.json` package if useful. Nothing uploads automatically. Review any additional raw logs or screenshots for personal paths and metadata.

        [Beta 1.7 test matrix](https://github.com/ValentineBSAA/XNFS-Playlist-Builder-/blob/main/docs/WHATS-NEW-BETA-1.7.md).
  - type: dropdown
    id: application-version
    attributes:
      label: Builder version
      options:
        - 3.2 Beta 1.7
        - 3.2 Beta 1.6
        - 3.2 Beta 1.5
        - Older / other
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game or app component
      options:
        - Most Wanted (2005)
        - Carbon (2006)
        - Windows application / installer / Support
    validations:
      required: true
  - type: input
    id: game-executable
    attributes:
      label: Game executable and version
      placeholder: "Most Wanted speed.exe, modified/PLAK, Carbon 1.2 or 1.4"
  - type: input
    id: windows
    attributes:
      label: Windows build and scaling
      placeholder: "Windows 11, 125%"
  - type: textarea
    id: setup
    attributes:
      label: Music mode, volume settings, ASI loader and other mods
      description: "Include relevant pursuits/events, fade settings, and any installed modifications."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior / exact error
    validations:
      required: true
  - type: dropdown
    id: repeats
    attributes:
      label: Does it happen again after restarting?
      options:
        - Yes
        - No
        - Haven't retested
  - type: textarea
    id: evidence
    attributes:
      label: Optional Support ZIP or redacted evidence
      description: "Attach your local diagnostics ZIP or reviewed screenshots/logs; do not share personal paths, private song metadata, game saves or audio."
