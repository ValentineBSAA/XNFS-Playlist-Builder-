name: "🐛 Something isn't working"
description: Report a problem with Carbon, Most Wanted, or the builder
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test Beta 1.2! Both games work with the builder, but this is a beta and results can vary. Remove any private paths or personal information from screenshots and logs.
  - type: dropdown
    id: game
    attributes:
      label: Which game or part of the app?
      options:
        - Carbon
        - Most Wanted (2005)
        - The Windows application
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Tell us in your own words. Include what you clicked, if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: version
    attributes:
      label: Game version (if known)
      placeholder: "For example, Carbon 1.2"
  - type: textarea
    id: extra
    attributes:
      label: Anything else that might help? (optional)
      description: Screenshots and error text are welcome. Remove private information before posting.
