name: "🐛 Report a Beta 1.5 bug"
description: "Help investigate crashes, installation problems or music playback"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing XNFS Playlist Builder. **Beta 1.5 is an experimental prerelease.**
        A successful configuration or file check is not the same as confirmed gameplay.
        Before posting logs or screenshots, remove Windows user names, local paths, IPs, and private song metadata.
        See [current limitations](https://github.com/ValentineBSAA/XNFS-Playlist-Builder-/blob/main/docs/WHATS-NEW-BETA-1.5.md).
  - type: dropdown
    id: application-version
    attributes:
      label: Application version
      options:
        - 3.2 Beta 1.5
        - 3.2 Beta 1.4
        - 3.0 Beta 1.2
        - Other / unknown
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Which game or part of the app?
      options:
        - Most Wanted (2005)
        - Carbon (2006)
        - Windows builder itself / installer
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Exact game executable / version (if known)
      placeholder: "For example: Carbon 1.2 or Carbon 1.4"
  - type: input
    id: windows
    attributes:
      label: Windows version and display scale
      placeholder: "Windows 11, 125% scaling"
  - type: textarea
    id: options
    attributes:
      label: What options were selected?
      description: "Include game profile, pursuit mode, event settings, skip key or other relevant options."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Numbered steps make the issue much easier to test."
      placeholder: "1. Open Game configuration…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: "Include the exact error or crash point."
    validations:
      required: true
  - type: dropdown
    id: retry
    attributes:
      label: Does it still happen after restarting the builder/game?
      options:
        - Yes
        - No
        - Haven't tried / can't safely retest
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted screenshots, logs or Windows crash details
      description: "From Game configuration > Installation > Open troubleshooting logs, if available. Review every attachment for private data before sharing."
