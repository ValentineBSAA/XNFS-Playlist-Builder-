name: "🐛 Something didn't work"
description: Help us investigate Carbon or Most Wanted problems
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying XNFS Playlist Builder! Please avoid posting private Windows paths or personal information. Note which beta you're using: 3.0 Beta 1.2 or 3.2 Beta 1.4.
  - type: dropdown
    id: game
    attributes:
      label: Which game?
      options:
        - Most Wanted (2005)
        - Carbon (2006)
        - The builder app itself
    validations:
      required: true
  - type: dropdown
    id: beta
    attributes:
      label: Which beta?
      options:
        - 3.2 Beta 1.4
        - 3.0 Beta 1.2
        - Not sure
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What were you trying to do?
      placeholder: For example, I was trying to save a new pursuit playlist.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version (if you know it)
      placeholder: For example, Carbon 1.2
  - type: textarea
    id: extra
    attributes:
      label: Anything else that could help?
      description: Screenshots and logs are welcome. Remove personal paths and information first.
