title: ""
body:
  - type: markdown
    attributes:
      value: |
        Welcome to **XNFS Playlist Builder 3.2 Beta 1.6**!

        Most Wanted testing has confirmed Safe House, prologue, ordinary and custom pursuit music, T skipping, EA Trax titles and the original pursuit exit fade in specific sessions. The latest custom exit-fade and save-switch behavior still need testing.

        Carbon 1.2 had earlier class/F9/ducking gameplay acceptance. Carbon 1.4 gameplay, event modes, and the intermittent Load Complete crash remain open. Separate custom Canyon/Pursuit buckets are not implemented.

        **One-sentence reports help:** game version, what you tried, and whether it worked. See https://github.com/ValentineBSAA/XNFS-Playlist-Builder-/blob/main/docs/WHATS-NEW-BETA-1.6.md

        For crashes, use Issues. The in-app Support ZIP can be reviewed before you share it; redact extra screenshots or manually attached logs.
  - type: textarea
    id: message
    attributes:
      label: What would you like to share?
      placeholder: "I tried Beta 1.6 with Most Wanted. The pursuit fade ... "
    validations:
      required: true
