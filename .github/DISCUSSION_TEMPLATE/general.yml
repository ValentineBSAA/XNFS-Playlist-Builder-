title: ""
body:
  - type: markdown
    attributes:
      value: |
        Welcome to **XNFS Playlist Builder 3.2 Beta 1.7**.

        Developer-reported Most Wanted game tests include **45 tracks each** in custom Pursuit, Safe House and Free Roam. Earlier game tests include T skipping, EA Trax titles, prologue audio and the original pursuit exit fade.

        **Verified manual configuration:** To balance car engine sound, change **Most Wanted → Audio options → Car Volume** in the game. The builder's music volume is independent.

        Carbon 1.4, original event modes and PLAK gameplay remain unverified. Custom Carbon Canyon/Pursuit buckets are not implemented; the intermittent Load Complete crash is unresolved.

        Read https://github.com/ValentineBSAA/XNFS-Playlist-Builder-/blob/main/docs/WHATS-NEW-BETA-1.7.md.

        Please include the game/executable, music mode and what you experienced. Use Issues for reproducible technical bugs. Redact additional logs/screenshots before posting.
  - type: textarea
    id: message
    attributes:
      label: What would you like to share?
      placeholder: "I tested Beta 1.7 with Most Wanted and custom pursuit music..."
    validations:
      required: true
