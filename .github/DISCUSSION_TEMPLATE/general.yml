title: ""
body:
  - type: markdown
    attributes:
      value: |
        Welcome to XNFS Playlist Builder. We're now testing **3.2 Beta 1.5**, the Hybrid Performance Studio for Most Wanted (2005) and Carbon (2006).

        Share your setup, ask a question, suggest a feature, or tell us what worked! Even a one-sentence test result is helpful.

        **Important:** Real-gameplay verification is still incomplete for the new Beta 1.5 release. Most Wanted original and custom pursuit were heard in earlier testing, but transition/overlap regression is still needed. Carbon's separate custom Canyon/Pursuit buckets are not implemented and event modes need game tests. The Carbon Load Complete crash remains unresolved.

        See: https://github.com/ValentineBSAA/XNFS-Playlist-Builder-/blob/main/docs/WHATS-NEW-BETA-1.5.md

        Use the Issues tab for a reproducible technical bug. Remove personal paths and song metadata from screenshots/logs.
  - type: textarea
    id: message
    attributes:
      label: What would you like to share?
      placeholder: "I tried Beta 1.5 with Carbon 1.2. F9 skipping worked, but I noticed…"
    validations:
      required: true
