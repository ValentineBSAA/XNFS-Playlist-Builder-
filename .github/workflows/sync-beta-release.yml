name: Refresh Beta 1.2 release description

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-beta-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public beta documentation
        uses: actions/checkout@v4
      - name: Replace release description without changing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v3.0-beta.1.2 --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
