name: Final public site quality check

on:
  push:
    paths:
      - ".github/workflows/check-public-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published repository
        uses: actions/checkout@v4

      - name: Validate local links, image folders and visitor wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote

          root=Path.cwd()
          images=[
             'screenshots/carbon/library.png',
             'screenshots/carbon/features.png',
             'screenshots/most-wanted/library.png',
             'screenshots/most-wanted/features.png',
             'screenshots/most-wanted/installation-status.png',
             'screenshots/most-wanted/restore-original.png',
             'screenshots/most-wanted/previous-beta-preview.png',
             'screenshots/shared/leveling-progress.png',
             'screenshots/shared/save-summary.png',
             'screenshots/shared/saved-files.png'
          ]
          assert len(list(Path('screenshots').rglob('*.png')))==len(images),'Unexpected image count'
          for name in images:
            data=Path(name).read_bytes()
            assert data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)>1000,name
          assert not list(Path('screenshots').glob('*.png')),'Old loose screenshots still present'

          docs=[Path('README.md'),Path('RELEASE_NOTES.md'),*Path('docs').rglob('*.md'),Path('screenshots/README.md')]
          found=0
          broken=[]
          pattern=r'!?\[[^\]]*\]\(([^)]+)\)|<img[^>]+src=["\x27]([^"\x27]+)'
          for page in docs:
            body=page.read_text(encoding='utf-8')
            for match in re.finditer(pattern,body):
              target=(match.group(1) or match.group(2)).strip()
              target=unquote(target.split('#')[0])
              if target.startswith(('https://','http://','mailto:','#')) or not target:
                continue
              file=(page.parent/target).resolve()
              found+=1
              if not file.is_relative_to(root) or not file.is_file():
                broken.append((str(page),target))
          assert not broken,'Broken Markdown/image links: '+repr(broken)
          home=Path('README.md').read_text()
          assert 'screenshots/carbon/library.png' in home
          assert 'screenshots/most-wanted/library.png' in home
          assert '3.2-Beta-1.4-Clean-Public.zip' in home
          assert 'docs/CARBON.md' in home and 'docs/MOST-WANTED.md' in home
          assert 'Your music' in home
          assert not any('v3.1-beta-1.4' in x.read_text() for x in docs),'Outdated release tag remains in public docs'
          print('VALIDATED:',len(docs),'Markdown pages;',found,'local links/images;',len(images),'PNG screenshots')
          PY

      - name: Check correctly tagged release and remove stale transfer asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v3.2-beta.1.4 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets | jq -e '.isDraft == false and ([.assets[].name] | index("XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip") != null)'
          if gh release view v3.1-beta-1.4 --repo "$GITHUB_REPOSITORY" --json assets \
              | jq -e '.assets[].name | select(. == "XNFS-Playlist-Builder-3.2-Beta-1.4-GitHub-Screenshots.zip")' > /dev/null; then
            gh release delete-asset v3.1-beta-1.4 \
              'XNFS-Playlist-Builder-3.2-Beta-1.4-GitHub-Screenshots.zip' \
              --repo "$GITHUB_REPOSITORY" --yes
            echo 'Removed one-time screenshot transfer archive from superseded release.'
          fi
