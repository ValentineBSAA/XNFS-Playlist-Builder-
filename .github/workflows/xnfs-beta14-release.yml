name: Finalize Beta 1.4 release and screenshots
on:
  push:
    paths:
      - ".github/workflows/xnfs-beta14-release.yml"
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v3.2-beta.1.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify public installer and optional screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xnfs-package
          gh release download v3.2-beta.1.4 --repo "$GITHUB_REPOSITORY" --dir /tmp/xnfs-package --pattern 'XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip'
          echo '56add4426e4a2e10ab6f86eb0ffcac04006082107ed8ecae67e531a164139957  /tmp/xnfs-package/XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          filename=Path('/tmp/xnfs-package/XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip')
          with zipfile.ZipFile(filename) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={'XNFS-Playlist-Builder-3.2-Beta-1.4-Setup.exe','READ-ME-FIRST.txt','READ-ME-FIRST.html'}
              assert hashlib.sha256(z.read('XNFS-Playlist-Builder-3.2-Beta-1.4-Setup.exe')).hexdigest()=='cd501eb42ad621f4a00d963a3f714ad27de4fafd2fe31905225b1c0dfffdba5a'
          print('Clean Beta 1.4 package verified')
          PY
          if gh release download v3.2-beta.1.4 --repo "$GITHUB_REPOSITORY" --dir /tmp/xnfs-package --pattern 'XNFS-Playlist-Builder-3.2-Beta-1.4-GitHub-Screenshots.zip'; then
            echo 'd89bcb777de8f2bf12e38d66e88fb7c7dc5d1e4809708e698664d82ea0c54cad  /tmp/xnfs-package/XNFS-Playlist-Builder-3.2-Beta-1.4-GitHub-Screenshots.zip' | sha256sum --check
            python3 - <<'PY'
          from pathlib import Path
          import zipfile
          file=Path('/tmp/xnfs-package/XNFS-Playlist-Builder-3.2-Beta-1.4-GitHub-Screenshots.zip')
          names={'most-wanted-library.png','most-wanted-features.png','most-wanted-installation-status.png','most-wanted-original-restore.png'}
          out=Path('screenshots/most-wanted-1.4')
          out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(file) as z:
              assert z.testzip() is None
              assert set(z.namelist())==names
              for n in names:
                  data=z.read(n)
                  assert data.startswith(b'\x89PNG\r\n\x1a\n')
                  (out/n).write_bytes(data)
          print('Imported four Beta 1.4 application screenshots')
          PY
            echo 'XNFS_SCREENSHOTS_IMPORTED=1' >> "$GITHUB_ENV"
          else
            echo 'No screenshot ZIP attached; keeping older labeled preview and awaiting artwork'
            echo 'XNFS_SCREENSHOTS_IMPORTED=0' >> "$GITHUB_ENV"
          fi
      - name: Update the simple homepage and help pages
        env:
          XNFS_SCREENSHOTS_IMPORTED: ${{ env.XNFS_SCREENSHOTS_IMPORTED }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base='https://github.com/ValentineBSAA/XNFS-Playlist-Builder-'
          download=base+'/releases/download/v3.2-beta.1.4/XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip'
          readme=Path('README.md');s=readme.read_text()
          a=s.index('> [!IMPORTANT]\n> **Version update:**')
          b=s.index('## 🎶 What is it?',a)
          s=s[:a]+'''> [!IMPORTANT]
          > **Public Beta 1.4:** Both Carbon and Most Wanted work with the builder. This beta needs more testing on different PCs, so back up your game before installing music features.

          ### 📥 Download XNFS Playlist Builder 3.2 Beta 1.4

          **[⬇️ Get the Windows installer ZIP]('''+download+''')** · **[🚀 Easy setup guide](docs/GETTING-STARTED.md)** · **[💬 Common questions](docs/TROUBLESHOOTING.md)**

          Download the file named **XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip**, extract it, and run the Windows Setup.exe. GitHub's automatic “Source code” ZIP is **not** the installer.

          '''+s[b:]
          if Path('screenshots/most-wanted-1.4/most-wanted-library.png').is_file():
              s=s.replace('[![Gold Most Wanted soundtrack builder from the previous public beta](screenshots/most-wanted-preview.png)](screenshots/most-wanted-preview.png)','[![Most Wanted Beta 1.4 showing Safe House, Free Roam, Race and Pursuit](screenshots/most-wanted-1.4/most-wanted-library.png)](screenshots/most-wanted-1.4/most-wanted-library.png)')
              s=s.replace("*This image is from the **previous public beta**. Beta 1.4's new Most Wanted screens will be added to the gallery as part of the screenshot update.*","*The new Beta 1.4 Most Wanted interface with four driving soundtracks.*")
              s=s.replace("[**📸 Browse the available application screenshots →**](screenshots/README.md)","[**📸 Browse all application screenshots →**](screenshots/README.md)")
          readme.write_text(s)
          guide=Path('docs/GETTING-STARTED.md');g=guide.read_text()
          a=g.index('> **Download status:**');b=g.index('## Before you start',a)
          g=g[:a]+'> **[⬇️ Download the official Beta 1.4 Windows ZIP]('+download+')**. Choose the Clean-Public ZIP, not GitHub\'s source code archives.\n\n'+g[b:]
          g=g.replace('When Beta 1.4 is published, download **XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip** (the final release file will be labeled clearly).','**[Download XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip]('+download+')**.')
          guide.write_text(g)
          help=Path('docs/TROUBLESHOOTING.md');t=help.read_text()
          a=t.index('## Where do I download Beta 1.4?')
          b=t.index('## What is an ASI loader?',a)
          t=t[:a]+'## Where do I download Beta 1.4?\n\n**[Download the official Beta 1.4 Windows ZIP]('+download+')**. Extract the Clean-Public ZIP and open Setup.exe inside. Do **not** choose GitHub\'s “Source code” archives.\n\n'+t[b:]
          help.write_text(t)
          check=Path('docs/SHA256-OF-BETA-1.4.txt')
          check.write_text('Official published Beta 1.4 ZIP: XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip\nSHA-256: 56add4426e4a2e10ab6f86eb0ffcac04006082107ed8ecae67e531a164139957\n\nIncluded installer: XNFS-Playlist-Builder-3.2-Beta-1.4-Setup.exe\nSHA-256: cd501eb42ad621f4a00d963a3f714ad27de4fafd2fe31905225b1c0dfffdba5a\n\nThe published ZIP matches the independently prepared cleaned public package, with the original installer preserved byte for byte.\n')
          notes=Path('RELEASE_NOTES.md');n=notes.read_text()
          n=n.replace("Download **XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip** from this release's attached assets **when it is published**.", "Download **XNFS-Playlist-Builder-3.2-Beta-1.4-Clean-Public.zip** from the attached release assets.")
          notes.write_text(n)
          if Path('screenshots/most-wanted-1.4/most-wanted-library.png').is_file():
              images=Path('screenshots/README.md')
              p=images.read_text();a=p.index('## 🟡 Most Wanted')
              p=p[:a]+'''## 🟡 Most Wanted: new in Beta 1.4

          ### The new soundtrack builder

          [![Most Wanted Safe House, Free Roam, Race and Pursuit playlist editor](most-wanted-1.4/most-wanted-library.png)](most-wanted-1.4/most-wanted-library.png)

          ### Music and skip features

          [![Most Wanted options for skip, shuffle and driving soundtracks](most-wanted-1.4/most-wanted-features.png)](most-wanted-1.4/most-wanted-features.png)

          ### What's installed

          [![Most Wanted feature installation status and checks](most-wanted-1.4/most-wanted-installation-status.png)](most-wanted-1.4/most-wanted-installation-status.png)

          ### Restore the original game

          [![Most Wanted original game restore summary](most-wanted-1.4/most-wanted-original-restore.png)](most-wanted-1.4/most-wanted-original-restore.png)

          [Earlier Most Wanted beta screenshot](most-wanted-preview.png). All images are from the developer's test system; the newest Safe House/menu combination still needs a follow-up in-game check.

          [← Homepage](../README.md)
          '''
              images.write_text(p)
          print('Beta 1.4 publication links updated, screenshots present:',Path('screenshots/most-wanted-1.4/most-wanted-library.png').is_file())
          PY
      - name: Commit updated public content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_NOTES.md docs/ screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Activate verified Beta 1.4 public download and screenshots"
            git push origin main
          fi
      - name: Update published release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v3.2-beta.1.4 --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
      - name: Remove optional screenshot-transfer ZIP from release
        if: env.XNFS_SCREENSHOTS_IMPORTED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset v3.2-beta.1.4 XNFS-Playlist-Builder-3.2-Beta-1.4-GitHub-Screenshots.zip --repo "$GITHUB_REPOSITORY" --yes
