name: Import Beta 1.5 screenshot gallery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-beta-1.5-gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the published Beta 1.5 screenshot archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download Beta-1.5 \
            --repo ValentineBSAA/XNFS-Playlist-Builder- \
            --pattern "GitHub.Screenshots.zip" \
            --dir "$RUNNER_TEMP"
      - name: Validate and import PNG images into the repository
        env:
          SCREENSHOT_ZIP: ${{ runner.temp }}/GitHub.Screenshots.zip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, zipfile
          source = Path(os.environ['SCREENSHOT_ZIP'])
          expected = 'b1fab73ce12568f9fe8e3ee2718041165f6bbc14aeb8f98f75165c382beb9583'
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Screenshot ZIP hash mismatch: {actual}')
          count = {'most-wanted': 0, 'carbon': 0}
          target = Path('screenshots/beta-1.5')
          with zipfile.ZipFile(source) as archive:
              for info in archive.infolist():
                  if info.is_dir() or not info.filename.lower().endswith('.png'):
                      continue
                  parts = Path(info.filename.replace('\\', '/')).parts
                  matches = [('most-wanted' if part == 'most_wanted' else 'carbon', idx)
                             for idx, part in enumerate(parts) if part in ('most_wanted', 'carbon')]
                  if not matches:
                      continue
                  game, idx = matches[-1]
                  if len(parts) != idx + 2:
                      raise SystemExit(f'Unexpected screenshot path: {info.filename}')
                  filename = parts[-1]
                  if filename in ('.', '..') or not filename.endswith('.png'):
                      raise SystemExit(f'Invalid file: {filename}')
                  if info.file_size > 5000000:
                      raise SystemExit(f'Unexpectedly large image: {filename}')
                  content = archive.read(info)
                  if not content.startswith(b'\x89PNG\r\n\x1a\n'):
                      raise SystemExit(f'Invalid PNG: {filename}')
                  out = target / game / filename
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(content)
                  count[game] += 1
          print('Imported:', count)
          if count['most-wanted'] < 15 or count['carbon'] < 12:
              raise SystemExit('Incomplete screenshot gallery. No commit.')
          PY
      - name: Commit uploaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/beta-1.5/
          if git diff --cached --quiet; then
            echo "Gallery already current."
          else
            git commit -m "Add real Beta 1.5 Most Wanted and Carbon screenshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
